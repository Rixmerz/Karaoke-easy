name: Instalador Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller
      - name: Descargar modelos (Demucs + Whisper base/small)
        run: python tools/download_models.py base small
      - name: PyInstaller
        run: pyinstaller --noconfirm KaraokeEasy.spec
      - name: Prueba de humo (procesa un audio de 6 s sin internet)
        shell: pwsh
        run: |
          python -c "import numpy as n,soundfile as s;t=n.arange(44100*6)/44100;y=0.2*n.sin(2*n.pi*220*t);s.write('prueba.wav',n.stack([y,y],1),44100)"
          $env:KARAOKE_SELFTEST = "prueba.wav"
          $p = Start-Process dist\KaraokeEasy\KaraokeEasy.exe -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content selftest.log -ErrorAction SilentlyContinue; exit 1 }
          Get-Content selftest.log
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\KaraokeEasy.iss
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeEasy-Setup
          path: Output/*.exe
          compression-level: 0
      - name: Publicar release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/*.exe
