name: Instalador Windows

# El instalador completo solo se construye al cambiar VERSION (nueva versión), con un tag v*
# o a mano. En cada push normal corren solo las pruebas rápidas (tests.yml).
on:
  push:
    branches: ["**"]   # sin esto, al declarar 'tags' GitHub ignora los push a ramas
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar como Release (ej. 1.0.0). Vacío = solo construir."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('tools/download_models.py') }}-small
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller pytest
      - name: Pruebas unitarias
        run: python -m pytest -q tests
      - name: Descargar modelos (Demucs + Whisper small + MMS_FA)
        run: python tools/download_models.py small
      - name: Motor (PyInstaller)
        run: pyinstaller --noconfirm KaraokeEasy.spec
      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: App de escritorio (Tauri 2, Rust)
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          (Get-Content src-tauri\tauri.conf.json -Raw) -replace '"version": "[^"]+"', "`"version`": `"$ver`"" | Set-Content src-tauri\tauri.conf.json -Encoding utf8
          cargo build --release --manifest-path src-tauri/Cargo.toml
          if (-not (Test-Path src-tauri\target\release\KaraokeEasy.exe)) { throw "no se generó KaraokeEasy.exe" }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $ver = "${{ inputs.version }}"; if (-not $ver) { $ver = (Get-Content VERSION).Trim() }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\KaraokeEasy.iss
          # Instalador ligero (sin componentes: se descargan en el primer uso) + paquete de componentes
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" "/DLIGHT" installer\KaraokeEasy.iss
          Push-Location dist\KaraokeEngine\_internal; 7z a -tzip -mx0 ..\..\..\Output\KaraokeEasy-Modelos.zip models | Out-Null; Pop-Location
          Get-ChildItem Output | Select-Object Name, Length
      - name: Prueba real del programa INSTALADO (carpeta de solo lectura, sin internet, desde un enlace)
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.Rate = -2
          $tts.SetOutputToWaveFile("$PWD\voz.wav")
          $tts.Speak("Hello my friend. The sun is shining on the river. Tonight we sing together under the stars.")
          $tts.Dispose()
          python -c "import numpy as n,soundfile as s,librosa as l;v,_=l.load('voz.wav',sr=44100);sr=44100;intro=sr*6;L=intro+len(v)+sr*3;t=n.arange(L)/sr;m=sum(n.sin(2*n.pi*f*t) for f in [196,246.9,293.7,98])*0.12;x=m.copy();x[intro:intro+len(v)]+=v*0.9;s.write('cancion prueba.wav',n.stack([x,x],1),sr)"
          # Instalar con el Setup.exe real, como un usuario
          $setup = Get-ChildItem Output\KaraokeEasy-Setup-*.exe | Where-Object { $_.Name -notmatch "Ligero" } | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\KE" -Wait
          if (-not (Test-Path C:\KE\KaraokeEasy.exe)) { throw "El instalador no dejó KaraokeEasy.exe" }
          if (-not (Test-Path C:\KE\engine\KaraokeEngine.exe)) { throw "El instalador no dejó el motor" }
          # Carpeta de instalación de solo lectura (como C:\Program Files para un usuario normal)
          # Solo derechos de escritura (no "W" genérico: incluye SYNCHRONIZE y bloquearía ejecutar)
          icacls C:\KE /deny "*S-1-1-0:(OI)(CI)(WD,AD,WA,WEA,DC)" /T /C /Q | Out-Null
          $escribe = $false
          try { New-Item C:\KE\_prueba_escritura.txt -ErrorAction Stop | Out-Null; $escribe = $true } catch { "Carpeta de solo lectura OK" }
          if ($escribe) { throw "la carpeta instalada debería ser de solo lectura" }
          New-Item -ItemType Directory salida | Out-Null
          # Se procesa DESDE UN ENLACE (yt-dlp) servido localmente
          New-Item -ItemType Directory web | Out-Null; Copy-Item "cancion prueba.wav" web\
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1","--directory","web" -PassThru
          Start-Sleep 2
          $env:KARAOKE_SELFTEST = "http://127.0.0.1:8765/cancion%20prueba.wav"
          $env:NO_PROXY = "127.0.0.1,localhost"
          $env:KARAOKE_OUT = "salida"
          $env:KARAOKE_LYRICS = "Hello my friend`nThe sun is shining on the river`nTonight we sing together under the stars"
          $env:KARAOKE_EXPECT = "friend sun shining river tonight sing together stars"
          # Sin internet: el proceso no debe descargar nada
          $env:HTTPS_PROXY = "http://127.0.0.1:9"; $env:HTTP_PROXY = "http://127.0.0.1:9"
          $p = Start-Process C:\KE\engine\KaraokeEngine.exe -Wait -PassThru -NoNewWindow
          Stop-Process $srv.Id -ErrorAction SilentlyContinue
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
          Remove-Item Env:HTTPS_PROXY, Env:HTTP_PROXY
          Get-ChildItem -Recurse salida | Select-Object FullName, Length
          # La app Tauri instalada debe abrir, arrancar el motor y cargar la biblioteca
          $env:KARAOKE_UI_SELFTEST = "1"
          $pp = Start-Process C:\KE\KaraokeEasy.exe -PassThru
          if (-not $pp.WaitForExit(180000)) { Stop-Process $pp.Id -Force; throw "La app no respondió en 3 minutos" }
          if ($pp.ExitCode -ne 0) { throw "La app no abrió bien (código $($pp.ExitCode))" }
          Remove-Item Env:KARAOKE_UI_SELFTEST
          Start-Sleep 2
          if (Get-Process KaraokeEngine -ErrorAction SilentlyContinue) { throw "El motor quedó abierto al cerrar la app" }
          "App de escritorio OK"
          # Instalador ligero: sin componentes, pero la app debe abrir igual
          $light = Get-ChildItem Output\KaraokeEasy-Setup-Ligero-*.exe | Select-Object -First 1
          Start-Process $light.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\KE2" -Wait
          if (Test-Path C:\KE2\engine\_internal\models) { throw "El instalador ligero no debería incluir los componentes" }
          $env:KARAOKE_UI_SELFTEST = "1"
          $pl = Start-Process C:\KE2\KaraokeEasy.exe -PassThru
          if (-not $pl.WaitForExit(180000)) { Stop-Process $pl.Id -Force; throw "La app ligera no respondió" }
          if ($pl.ExitCode -ne 0) { throw "La app ligera no abrió bien (código $($pl.ExitCode))" }
          Remove-Item Env:KARAOKE_UI_SELFTEST
          "Instalador ligero OK"
      - name: Flujo real de la app (motor instalado + cola de trabajos + enlace)
        shell: pwsh
        run: |
          New-Item -ItemType Directory web2 -Force | Out-Null; Copy-Item "cancion prueba.wav" web2\
          $srv = Start-Process python -ArgumentList "-m","http.server","8766","--bind","127.0.0.1","--directory","web2" -PassThru
          $eng = Start-Process C:\KE\engine\KaraokeEngine.exe -ArgumentList "--serve","--no-stdin-watch" -RedirectStandardOutput eng.out -RedirectStandardError eng.err -PassThru -NoNewWindow
          for ($i = 0; $i -lt 120; $i++) { if ((Test-Path eng.out) -and (Select-String -Path eng.out -Pattern ENGINE_READY -Quiet)) { break }; Start-Sleep 1 }
          $ready = (Select-String -Path eng.out -Pattern ENGINE_READY).Line.Split(" ")
          if (-not $ready) { Get-Content eng.err; throw "El motor instalado no arrancó" }
          $base = "http://127.0.0.1:$($ready[1])/api/"; $h = @{ "X-Token" = $ready[2] }
          Invoke-RestMethod "${base}settings" -Method Post -Headers $h -ContentType "application/json" -Body (@{ output_dir = "$PWD\salida_cola" } | ConvertTo-Json) | Out-Null
          function Run-Job($url, $opts, $limit) {
            $body = @{ inputs = @($url); options = $opts } | ConvertTo-Json -Depth 5
            $id = (Invoke-RestMethod "${base}jobs" -Method Post -Headers $h -ContentType "application/json" -Body $body)[0].id
            $t0 = Get-Date; $last = ""
            while ($true) {
              Start-Sleep 2
              $j = (Invoke-RestMethod "${base}jobs" -Headers $h) | Where-Object { $_.id -eq $id }
              $info = "$($j.state) paso=$($j.step) $([math]::Round($j.fraction*100))%"
              if ($j.download) { $info += " descarga=$($j.download.phase) $([math]::Round(($j.download.fraction ?? 0)*100))%" }
              if ($info -ne $last) { Write-Host ("{0,5:N0}s  {1}" -f ((Get-Date) - $t0).TotalSeconds, $info); $last = $info }
              if ($j.state -in @("done", "error", "cancelled")) { break }
              if (((Get-Date) - $t0).TotalSeconds -gt $limit) { Invoke-RestMethod "${base}jobs/$id/cancel" -Method Post -Headers $h -ContentType "application/json" -Body "{}" | Out-Null; $j.state = "timeout"; break }
            }
            Write-Host "---- registro del trabajo ----"; $j.log | Select-Object -Last 40 | ForEach-Object { Write-Host $_ }
            return [string]$j.state   # solo el estado (lo demás va por Write-Host)
          }
          $st = [string](Run-Job "http://127.0.0.1:8766/cancion%20prueba.wav" @{ lyrics = "Hello my friend`nThe sun is shining on the river`nTonight we sing together under the stars"; use_source_video = $false } 600 | Select-Object -Last 1)
          "Resultado del trabajo con enlace local: $st"
          "==== YouTube real (informativo, no hace fallar el build) ===="
          $yt = Run-Job "https://www.youtube.com/watch?v=jNQXAC9IVRw" @{ use_source_video = $false } 300
          "Resultado YouTube: $yt"
          "---- registro de diagnóstico ----"; Get-Content "$env:LOCALAPPDATA\KaraokeEasy\registro.log" -Tail 60 -ErrorAction SilentlyContinue
          Stop-Process $eng.Id -Force -ErrorAction SilentlyContinue; Stop-Process $srv.Id -ErrorAction SilentlyContinue
          Get-Process KaraokeEngine -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($st -ne "done") { throw "El flujo real de la app no terminó (estado: $st)" }
          "Flujo del motor OK"
          # Ahora como un usuario: la app instalada pega el enlace, pulsa "Crear karaoke", espera y abre el reproductor
          $srv2 = Start-Process python -ArgumentList "-m","http.server","8766","--bind","127.0.0.1","--directory","web2" -PassThru
          $env:KARAOKE_UI_SELFTEST = "1"
          $env:KARAOKE_UI_SELFTEST_URL = "http://127.0.0.1:8766/cancion%20prueba.wav"
          $env:KARAOKE_UI_SELFTEST_LOG = "$PWD\ui_e2e.log"
          $pe = Start-Process C:\KE\KaraokeEasy.exe -PassThru
          $okE2E = $pe.WaitForExit(1200000)
          Get-Content ui_e2e.log -ErrorAction SilentlyContinue
          Remove-Item Env:KARAOKE_UI_SELFTEST, Env:KARAOKE_UI_SELFTEST_URL, Env:KARAOKE_UI_SELFTEST_LOG
          Stop-Process $srv2.Id -ErrorAction SilentlyContinue
          if (-not $okE2E) { Stop-Process $pe.Id -Force; throw "La prueba de punta a punta desde la interfaz no terminó en 20 min" }
          if ($pe.ExitCode -ne 0) { throw "La prueba de punta a punta desde la interfaz falló" }
          "Flujo real desde la interfaz OK"
      - uses: actions/upload-artifact@v4
        with:
          name: resultado-prueba
          path: |
            salida/**/*.mp4
            salida/**/*.mp3
            salida/**/karaoke.ass
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeEasy-Setup
          path: Output/KaraokeEasy-Setup-[0-9]*.exe
          compression-level: 0
      - name: Publicar Release (automático en cada build correcto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: Karaoke Easy ${{ env.APP_VERSION }}
          make_latest: true
          body: |
            Instalador para Windows 10/11 (64 bits) con todos los modelos incluidos: no necesita Python ni internet para procesar (solo para buscar la letra en LRCLIB).

            1. Descarga **`KaraokeEasy-Setup-${{ env.APP_VERSION }}.exe`** (completo, funciona sin internet) o **`KaraokeEasy-Setup-Ligero-${{ env.APP_VERSION }}.exe`** (más liviano: descarga los componentes la primera vez) desde *Assets* y ejecútalo. Si SmartScreen avisa: "Más información" → "Ejecutar de todas formas".
            2. Siguiente → Instalar → abre **Karaoke Easy**.
            3. Elige tu MP3/MP4/WAV → (opcional) *Analizar tono* y semitonos → **Crear karaoke**.

            Compilado desde ${{ github.sha }}.
          files: |
            Output/*.exe
            Output/KaraokeEasy-Modelos.zip

  # Edición Steam (karaoke_easy/edition.py): mismo código, sin enlaces, sin actualizador propio,
  # con Steamworks en la app. No lleva instalador: Steam instala la carpeta. Ver docs/steam-build.md.
  steam:
    runs-on: windows-latest
    timeout-minutes: 75
    outputs:
      version: ${{ steps.pack.outputs.version }}
      can_upload: ${{ steps.check.outputs.can_upload }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Caché de modelos
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('tools/download_models.py') }}-small
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pyinstaller pytest
      - name: Pruebas de la edición Steam
        run: python -m pytest -q tests/test_edition.py
      - name: Descargar modelos
        run: python tools/download_models.py small
      - name: Motor (PyInstaller, edición Steam)
        shell: pwsh
        run: |
          Set-Content -Path EDITION -Value "steam" -NoNewline -Encoding ascii
          pyinstaller --noconfirm KaraokeEasy.spec
          if (-not (Test-Path dist\KaraokeEngine\_internal\EDITION)) { throw "EDITION no quedó dentro del motor" }
      - name: Caché de Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: steam
      - name: App de escritorio (Tauri 2 + Steamworks)
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          (Get-Content src-tauri\tauri.conf.json -Raw) -replace '"version": "[^"]+"', "`"version`": `"$ver`"" | Set-Content src-tauri\tauri.conf.json -Encoding utf8
          cargo build --release --features steam --manifest-path src-tauri/Cargo.toml
          if (-not (Test-Path src-tauri\target\release\KaraokeEasy.exe)) { throw "no se generó KaraokeEasy.exe" }
      - name: Carpeta y zip KaraokeEasy-Steam-<versión>
        id: pack
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          $dst = "dist-steam\KaraokeEasy"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item src-tauri\target\release\KaraokeEasy.exe $dst
          # steamworks-sys trae el SDK redistribuible y deja steam_api64.dll en su carpeta de build
          $dll = Get-ChildItem src-tauri\target\release\build -Recurse -Filter steam_api64.dll | Where-Object { $_.FullName -match "steamworks-sys" } | Select-Object -First 1
          if (-not $dll) { throw "no se encontró steam_api64.dll" }
          Copy-Item $dll.FullName $dst
          Copy-Item -Recurse dist\KaraokeEngine "$dst\engine"
          if (Test-Path "$dst\engine\_internal\yt_dlp") { throw "la versión Steam no debe incluir yt-dlp" }
          Compress-Archive -Path "$dst\*" -DestinationPath "dist-steam\KaraokeEasy-Steam-$ver.zip" -CompressionLevel Fastest
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Get-ChildItem dist-steam | Select-Object Name, Length
      - name: ¿Hay credenciales de Steam?
        id: check
        shell: pwsh
        env:
          U: ${{ secrets.STEAM_USERNAME }}
          C: ${{ secrets.STEAM_CONFIG_VDF }}
          A: ${{ vars.STEAM_APP_ID }}
          D: ${{ vars.STEAM_DEPOT_ID }}
        run: |
          $ok = [bool]($env:U -and $env:C -and $env:A -and $env:D)
          "can_upload=$($ok.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $ok) { "Faltan STEAM_USERNAME/STEAM_CONFIG_VDF (secretos) o STEAM_APP_ID/STEAM_DEPOT_ID (variables): no se sube a Steam." }
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeEasy-Steam
          path: dist-steam/KaraokeEasy-Steam-*.zip
          compression-level: 0

  # Motor GPU (NVIDIA), complemento opcional (docs/gpu.md). Mismo código, torch con CUDA 12.8.
  # Produce: el pack dividido para la versión directa (KaraokeEasy-GPU-<ver>.zip.001… + .json con
  # sha256) y la carpeta del depot DLC de Steam (gpu/). No toca los otros jobs.
  # Sin caché de pip a propósito: el wheel de torch CUDA pesa ~3 GB y desalojaría la caché de modelos.
  gpu:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias (torch CUDA 12.8)
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cu128
          pip install --no-cache-dir -r requirements.txt "ctranslate2>=4.5,<5" pyinstaller pytest
          python -c "import torch, ctranslate2; print('torch', torch.__version__, 'CUDA', torch.version.cuda, 'ct2', ctranslate2.__version__); assert (torch.version.cuda or '').startswith('12.')"
          # Arquitecturas compiladas en el wheel (get_arch_list() da [] sin GPU): RTX 50 (sm_120) es obligatoria; GTX 10xx (sm_61) se avisa
          python -c "import torch; a=(torch._C._cuda_getArchFlags() or '').split(); print('arquitecturas:', a); assert 'sm_120' in a; print('::warning::sin sm_61 (GTX 10xx)') if 'sm_61' not in a else None"
      - name: Pruebas del Motor GPU (sin tarjeta, lógica y pack)
        run: python -m pytest -q tests/test_gpu.py
      - name: Motor GPU (PyInstaller)
        shell: pwsh
        run: |
          $env:KARAOKE_GPU = "1"
          pyinstaller --noconfirm KaraokeEasy.spec
          $lib = "dist\KaraokeEngine-GPU\_internal\torch\lib"
          # ctranslate2 (faster-whisper) usa las cuBLAS/cuDNN de torch: deben estar dentro del motor
          foreach ($d in "cublas64_12.dll", "cublasLt64_12.dll", "cudnn64_9.dll", "torch_cuda.dll") {
            if (-not (Test-Path "$lib\$d")) { Get-ChildItem $lib | Select-Object Name, Length; throw "falta $d en el Motor GPU" } }
          if (-not (Get-ChildItem dist\KaraokeEngine-GPU\_internal -Recurse -Filter ctranslate2.dll)) { throw "falta ctranslate2.dll" }
          if (Test-Path dist\KaraokeEngine-GPU\_internal\models) { throw "el Motor GPU no debe llevar modelos" }
          "{0:N2} GB sin comprimir" -f ((Get-ChildItem dist\KaraokeEngine-GPU -Recurse | Measure-Object Length -Sum).Sum / 1GB)
      - name: "Autoprueba en el runner (sin GPU, debe arrancar y responder sin CUDA)"
        shell: pwsh
        run: |
          $out = & dist\KaraokeEngine-GPU\KaraokeEngine-GPU.exe --gpu-selftest
          $out
          $line = $out | Where-Object { $_ -like "GPU_SELFTEST *" } | Select-Object -First 1
          if (-not $line) { throw "el Motor GPU no respondió a --gpu-selftest" }
          $r = $line.Substring(13) | ConvertFrom-Json
          if ($r.version -ne (Get-Content VERSION).Trim()) { throw "versión distinta en el Motor GPU" }
          if ($r.error -match "DLL|ImportError|ModuleNotFound") { throw "el Motor GPU no carga sus librerías: $($r.error)" }
      - name: Pack dividido (directa) + manifiesto sha256
        id: pack
        shell: pwsh
        run: |
          $ver = (Get-Content VERSION).Trim()
          New-Item -ItemType Directory -Force Output-GPU | Out-Null
          # Un solo .zip cortado en trozos de 1900 MB (límite de 2 GB por archivo en GitHub Releases)
          Push-Location dist\KaraokeEngine-GPU; 7z a -tzip -mx1 -v1900m "..\..\Output-GPU\KaraokeEasy-GPU-$ver.zip" * | Out-Null; Pop-Location
          python tools/gpu_manifest.py "$ver" Output-GPU
          Get-ChildItem Output-GPU | Select-Object Name, Length
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeEasy-GPU-pack
          path: Output-GPU/*
          compression-level: 0
      - name: Carpeta del depot DLC de Steam (gpu/)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-steam-gpu | Out-Null
          Move-Item dist\KaraokeEngine-GPU dist-steam-gpu\gpu   # mover, no copiar: el disco del runner es justo
      - uses: actions/upload-artifact@v4
        with:
          name: KaraokeEasy-Steam-GPU-depot
          path: dist-steam-gpu
          compression-level: 1

  # Publica el pack GPU en el mismo Release que el instalador, solo si este se publicó bien.
  gpu-release:
    needs: [build, gpu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KaraokeEasy-GPU-pack
          path: gpu-pack
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gpu.outputs.version }}
          files: gpu-pack/*

  # Subida a Steam (SteamPipe) en la rama "beta", solo si hay credenciales. Corre en Linux
  # (donde game-ci/steam-deploy está probado) con el zip que construyó el job anterior.
  # Si existe la variable STEAM_GPU_DEPOT_ID y el job gpu salió bien, sube también el depot del
  # DLC "Motor GPU" en el MISMO build (un build sin ese depot dejaría el DLC vacío en esa rama).
  steam-upload:
    needs: [steam, gpu]
    if: ${{ !cancelled() && needs.steam.result == 'success' && needs.steam.outputs.can_upload == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: KaraokeEasy-Steam
      - name: Descomprimir
        run: mkdir -p build/KaraokeEasy && unzip -q KaraokeEasy-Steam-*.zip -d build/KaraokeEasy
      - uses: actions/download-artifact@v4
        if: ${{ vars.STEAM_GPU_DEPOT_ID != '' && needs.gpu.result == 'success' }}
        with:
          name: KaraokeEasy-Steam-GPU-depot
          path: build/GPU   # contiene gpu/: Steam lo instala en <app>\gpu
      - uses: game-ci/steam-deploy@v3.3.0
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ vars.STEAM_APP_ID }}
          buildDescription: v${{ needs.steam.outputs.version }} (${{ github.sha }})
          rootPath: build
          depot1Path: KaraokeEasy
          depot1Id: ${{ vars.STEAM_DEPOT_ID }}
          depot2Path: ${{ (vars.STEAM_GPU_DEPOT_ID != '' && needs.gpu.result == 'success') && 'GPU' || '' }}
          depot2Id: ${{ (vars.STEAM_GPU_DEPOT_ID != '' && needs.gpu.result == 'success') && vars.STEAM_GPU_DEPOT_ID || '' }}
          releaseBranch: beta
